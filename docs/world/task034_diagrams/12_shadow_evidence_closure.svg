<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#e4e6e8"/><path d="M0 7L7 0" stroke="#8c949b"/></pattern><pattern id="trial" width="7" height="7" patternUnits="userSpaceOnUse"><rect width="7" height="7" fill="#fff0d8"/><path d="M0 7L7 0" stroke="#bf6621"/></pattern><marker id="view" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#a82050"/></marker><marker id="light" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#bf6621"/></marker></defs><rect width="1200" height="1000" fill="white"/><text x="25" y="32" font-family="Arial" font-size="23" font-weight="bold">D12 · TASK-034.2 — shadow / evidence closure trials</text><text x="25" y="56" font-family="Arial" font-size="14" >DESIGNER ONLY. P2 remains the baseline. Orange S1/S2 additions are tested and REJECTED, not adopted geometry.</text><text x="25" y="78" font-family="Arial" font-size="12" >A visible-surface cover is not an all-points visibility claim. Red witnesses are individually ray-checked inside the rendered viewport.</text><rect x="25" y="100" width="550" height="350" fill="#fff" stroke="#bac0c5" rx="6"/><rect x="605" y="100" width="570" height="350" fill="#fff" stroke="#bac0c5" rx="6"/><rect x="25" y="470" width="550" height="350" fill="#fff" stroke="#bac0c5" rx="6"/><rect x="605" y="470" width="570" height="350" fill="#fff" stroke="#bac0c5" rx="6"/><text x="42" y="125" font-family="Arial" font-size="15" >1 · Visor catches the old lintel ray, but not all shadows</text><rect x="90" y="385" width="304.5" height="12.6" fill="none" stroke="#135ea0" stroke-width="3"/><rect x="69" y="420" width="357" height="5" fill="#ddd" stroke="#384047" /><rect x="139" y="259" width="84" height="84" fill="#f6faff" stroke="#135ea0" stroke-width="2"/><rect x="79.5" y="161" width="21" height="21" fill="#f6faff" stroke="#135ea0" stroke-width="2"/><rect x="419" y="206.5" width="7" height="213.5" fill="url(#hatch)" stroke="#384047" /><rect x="328" y="206.5" width="98" height="10.5" fill="url(#hatch)" stroke="#384047" /><rect x="114.5" y="206.5" width="213.5" height="10.5" fill="url(#trial)" stroke="#bf6621" /><line x1="419" y1="217" x2="419" y2="390.46" stroke="#52abb5" stroke-width="5" /><line x1="90" y1="168" x2="156.68" y2="206.5" stroke="#66717a" stroke-width="2" stroke-dasharray="4 3"/><line x1="41" y1="194.03" x2="219.5" y2="259" stroke="#bf6621" stroke-width="2" marker-end="url(#light)"/><line x1="219.5" y1="259" x2="419" y2="331.61" stroke="#bf6621" stroke-width="3" marker-end="url(#light)"/><circle cx="349" cy="280" r="5" fill="#a82050"/><line x1="349" y1="280" x2="419" y2="331.61" stroke="#a82050" stroke-width="2" marker-end="url(#view)"/><circle cx="419" cy="331.61" r="5" fill="#bc3039"/><text x="47" y="152" font-family="Arial" font-size="13" >collar</text><text x="166" y="292" font-family="Arial" font-size="13" >Cube</text><text x="151" y="188" font-family="Arial" font-size="12" >S1 visor extension; top is H</text><text x="443" y="263" font-family="Arial" font-size="12" >V: inner wall</text><text x="443" y="301" font-family="Arial" font-size="13" >F ∈ V ∩ S</text><text x="443" y="321" font-family="Arial" font-size="12" >z=0.7627</text><text x="50" y="442" font-family="Arial" font-size="12" >20° light clears the facility wall, then passes below the visor. S2 stops F only.</text><text x="624" y="125" font-family="Arial" font-size="15" >2 · Low oblique exterior light bypasses the fascia</text><rect x="792" y="251.9" width="188" height="155.1" fill="#f6faff" stroke="#135ea0" stroke-width="2"/><rect x="843.7" y="233.1" width="84.6" height="18.8" fill="#f6faff" stroke="#135ea0" /><path d="M843.7 233.1 Q843.7 202.55 886 202.55 Q928.3 202.55 928.3 233.1" fill="none" stroke="#135ea0" stroke-width="2"/><rect x="857.8" y="317.7" width="56.4" height="56.4" fill="none" stroke="#135ea0" /><rect x="799.05" y="399.95" width="14.1" height="14.1" fill="#f6faff" stroke="#135ea0" /><rect x="958.85" y="399.95" width="14.1" height="14.1" fill="#f6faff" stroke="#135ea0" /><rect x="820.2" y="181.4" width="131.6" height="4.7" fill="url(#hatch)" stroke="#384047" /><rect x="820.2" y="186.1" width="4.7" height="61.1" fill="url(#hatch)" stroke="#384047" /><rect x="947.1" y="186.1" width="4.7" height="61.1" fill="url(#hatch)" stroke="#384047" /><rect x="820.2" y="247.2" width="131.6" height="143.35" fill="none" stroke="#bf6621" stroke-dasharray="5 3"/><rect x="820.2" y="385.85" width="131.6" height="4.7" fill="url(#trial)" stroke="#bf6621" /><line x1="947.1" y1="247.2" x2="947.1" y2="186.1" stroke="#52abb5" stroke-width="5" /><line x1="792" y1="411.68" x2="799.05" y2="401.6" stroke="#bf6621" stroke-width="2" marker-end="url(#light)"/><line x1="799.05" y1="401.6" x2="947.1" y2="190.17" stroke="#bf6621" stroke-width="3" marker-end="url(#light)"/><circle cx="886" cy="233.1" r="5" fill="#a82050"/><line x1="886" y1="233.1" x2="947.1" y2="190.17" stroke="#a82050" stroke-width="2" marker-end="url(#view)"/><circle cx="947.1" cy="190.17" r="5" fill="#bc3039"/><text x="1000" y="176" font-family="Arial" font-size="12" >L: east inside face</text><text x="1000" y="198" font-family="Arial" font-size="12" >Mirror gives R.</text><text x="625" y="245" font-family="Arial" font-size="12" >V: inward faces</text><text x="625" y="270" font-family="Arial" font-size="12" >H: outer faces</text><text x="625" y="295" font-family="Arial" font-size="12" >S1/S2 do not</text><text x="625" y="315" font-family="Arial" font-size="12" >close the side path.</text><text x="966" y="368" font-family="Arial" font-size="12" >S2 fascia</text><text x="966" y="389" font-family="Arial" font-size="12" >(above eye-height)</text><text x="624" y="442" font-family="Arial" font-size="12" >Plan projection; post hit z=2.4662 → L z=-0.0947. No ray through a fixed wall.</text><text x="42" y="495" font-family="Arial" font-size="15" >3 · A lamp below the canopy can shadow its underside</text><text x="42" y="515" font-family="Arial" font-size="12" >Oblique y–z projection; x changes along the verified ray.</text><rect x="98" y="769" width="304.5" height="11.34" fill="none" stroke="#135ea0" stroke-width="2"/><rect x="147" y="655.6" width="84" height="75.6" fill="#f6faff" stroke="#135ea0" stroke-width="2"/><rect x="87.5" y="567.4" width="21" height="201.6" fill="none" stroke="#135ea0" stroke-width="2"/><rect x="122.5" y="608.35" width="213.5" height="9.45" fill="url(#trial)" stroke="#bf6621" /><rect x="336" y="608.35" width="98" height="9.45" fill="url(#hatch)" stroke="#384047" /><rect x="427" y="608.35" width="7" height="192.15" fill="url(#hatch)" stroke="#384047" /><line x1="336" y1="617.8" x2="427" y2="617.8" stroke="#52abb5" stroke-width="5" /><line x1="49" y1="701.27" x2="420" y2="617.8" stroke="#bf6621" stroke-width="3" marker-end="url(#light)"/><circle cx="357" cy="674.5" r="5" fill="#a82050"/><line x1="357" y1="674.5" x2="420" y2="617.8" stroke="#a82050" stroke-width="2" marker-end="url(#view)"/><circle cx="420" cy="617.8" r="5" fill="#bc3039"/><text x="145" y="583" font-family="Arial" font-size="12" >S1 extended roof</text><text x="429" y="582" font-family="Arial" font-size="13" >U ∈ V ∩ S</text><text x="43" y="724" font-family="Arial" font-size="12" >test lamp</text><text x="159" y="748" font-family="Arial" font-size="12" >Cube / post union</text><text x="43" y="802" font-family="Arial" font-size="12" >Light (2.4,-1,1.0) → U (-1.2,4.6,2.4); yaw -20°, pitch +25°.</text><text x="624" y="495" font-family="Arial" font-size="16" >4 · The surface-set test does not pass</text><rect x="627" y="517" width="17" height="17" fill="#c9eef0" stroke="#52abb5" /><text x="655" y="531" font-family="Arial" font-size="13" >A / V: inner walls, roof underside, reachable bed.</text><rect x="627" y="548" width="17" height="17" fill="#ffe1be" stroke="#bf6621" /><text x="655" y="562" font-family="Arial" font-size="13" >B / S: changing evidence reaches F, L, R, U, T.</text><rect x="627" y="579" width="17" height="17" fill="url(#hatch)" stroke="#384047" /><text x="655" y="593" font-family="Arial" font-size="13" >C / H: roof top, outer cheeks, shielded exterior.</text><text x="627" y="628" font-family="Arial" font-size="15" fill="#a52933">S1: V ∩ S contains F / L / R / U / T.</text><text x="627" y="652" font-family="Arial" font-size="15" fill="#a52933">S2 blocks F; L / R / U / T still survive.</text><text x="627" y="689" font-family="Arial" font-size="12" >T is a distinct rear-tongue shadow (coordinates in §5.6).</text><text x="627" y="711" font-family="Arial" font-size="12" >S3 rear screen blocks boarding; S4 side cheeks block entry.</text><text x="627" y="744" font-family="Arial" font-size="12" >Existing body tolerance / support / recall geometry retained.</text><text x="627" y="769" font-family="Arial" font-size="12" >Human stopping, support and mystery comprehension:</text><text x="627" y="791" font-family="Arial" font-size="12" >UNVALIDATED human questions, not the objective blocker.</text><line x1="25" y1="848" x2="1175" y2="848" stroke="#bcc4c9" stroke-width="1" /><rect x="25" y="867" width="18" height="12" fill="#ddd" stroke="#384047" /><text x="49" y="879" font-family="Arial" font-size="12" >FIXED structure</text><rect x="210" y="867" width="18" height="12" fill="none" stroke="#135ea0" stroke-width="3"/><text x="235" y="879" font-family="Arial" font-size="12" >ASSEMBLY</text><circle cx="380" cy="873" r="6" fill="#a82050"/><text x="393" y="879" font-family="Arial" font-size="12" >PLAYER</text><line x1="485" y1="873" x2="515" y2="873" stroke="#a82050" stroke-width="2" marker-end="url(#view)"/><text x="523" y="879" font-family="Arial" font-size="12" >VIEW</text><line x1="608" y1="873" x2="638" y2="873" stroke="#a86d00" stroke-width="3" /><text x="646" y="879" font-family="Arial" font-size="12" >BEAM (none in light trials)</text><line x1="881" y1="873" x2="912" y2="873" stroke="#14834a" stroke-width="4" /><text x="921" y="879" font-family="Arial" font-size="12" >VISIBLE body envelope</text><rect x="25" y="901" width="18" height="12" fill="url(#hatch)" stroke="#384047" /><text x="49" y="913" font-family="Arial" font-size="12" >FIXED OCCLUDER</text><rect x="245" y="901" width="18" height="12" fill="none" stroke="#754099" stroke-dasharray="5 3"/><text x="270" y="913" font-family="Arial" font-size="12" >CANDIDATE quantum envelope (unused)</text><rect x="570" y="901" width="18" height="12" fill="url(#trial)" stroke="#bf6621" /><text x="596" y="913" font-family="Arial" font-size="12" >TRIAL FIXED SHIELD, not an adopted change</text><text x="25" y="950" font-family="Arial" font-size="16" font-weight="bold">REVISE — no fixed-geometry closure established. P2 and all participant cards stay unchanged.</text><text x="25" y="976" font-family="Arial" font-size="12" >Designer annotations only. Coordinates and first-hit calculations: decision document §5.6. No implementation or human testing.</text></svg>
